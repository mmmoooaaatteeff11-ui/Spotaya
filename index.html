<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صيد الكنوز الاحترافية</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="game-container">
        <!-- لوحة النتائج -->
        <div class="scoreboard">
            <span>النقاط: <strong id="score">0</strong></span>
            <span>الأرواح: <strong id="lives">❤️❤️❤️</strong></span>
        </div>

        <!-- شاشة البداية / النهاية -->
        <div id="game-message" class="message-screen">
            <h1>لعبة صيد الكنوز 🌟</h1>
            <p>استخدم السهم الأيمن والأيسر لتحريك السلة وجمع النجوم!</p>
            <button id="start-btn">ابدأ اللعبة</button>
        </div>

        <!-- اللاعب (السلة) -->
        <div id="basket">🧺</div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
